services:
  - type: web
    name: alpha-solana-terminal
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/alpha.sqlite
    disk:
      name: alpha-data
      mountPath: /var/data
      sizeGB: 1
