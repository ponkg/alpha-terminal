name: Beta access verification

on:
  pull_request:
    branches: [main]
    paths:
      - "server.js"
      - "public/index.html"
      - "supabase/schema.sql"
      - "package.json"
      - ".github/workflows/beta-access-check.yml"
  push:
    branches: [feature/beta-access-invites]
  workflow_dispatch:

jobs:
  syntax-and-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node --check server.js
      - name: Check inline frontend JavaScript
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import vm from 'node:vm'; const html=fs.readFileSync('public/index.html','utf8'); const scripts=[...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(s=>s.trim()); if(!scripts.length) throw new Error('No inline JavaScript found'); scripts.forEach((source,index)=>new vm.Script(source,{filename:'inline-'+index+'.js'})); console.log('Validated '+scripts.length+' inline scripts');"
      - name: Assert protected routes and admin-only manager
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('server.js', 'utf8');
          const requiredRoutes = [
            'app.get("/api/token-meta", tokenMetaLimiter, requireAccess',
            'app.get("/api/gecko", geckoLimiter, requireAccess',
            'app.get("/api/jupiter/trending", jupiterLimiter, requireAccess',
            'app.get("/api/narrative-news", narrativeNewsLimiter, requireAccess',
            'app.get("/api/admin/waitlist", requireAdmin',
            'app.post("/api/admin/waitlist/:id/invite", requireAdmin',
            'app.patch("/api/admin/waitlist/:id/access", requireAdmin'
          ];
          for (const route of requiredRoutes) {
            if (!source.includes(route)) throw new Error('Missing protected route or access middleware: ' + route);
          }
          console.log('Protected API routes and admin gates verified.');
          NODE
