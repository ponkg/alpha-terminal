name: Beta access verification

on:
  pull_request:
    branches: [main]
    paths:
      - "server.js"
      - "public/index.html"
      - "supabase/schema.sql"
      - "package.json"
      - ".github/workflows/beta-access-check.yml"
  push:
    branches: [feature/beta-access-invites]
  workflow_dispatch:

jobs:
  syntax-and-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node --check server.js
      - name: Check inline frontend JavaScript
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const html=fs.readFileSync('public/index.html','utf8'); const scripts=[...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(s=>s.trim()); if(scripts.length!==1) throw new Error('Expected one inline app script, found '+scripts.length); fs.writeFileSync('/tmp/alpha-inline.js',scripts[0]);"
          node --check /tmp/alpha-inline.js
      - name: Assert protected routes and admin-only manager
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('server.js', 'utf8');
          const accessRoutes = [
            /app\\.get\\("\/api\/token-meta",\\s*tokenMetaLimiter,\\s*requireAccess/,
            /app\\.get\\("\/api\/gecko",\\s*geckoLimiter,\\s*requireAccess/,
            /app\\.get\\("\/api\/jupiter\/trending",\\s*jupiterLimiter,\\s*requireAccess/,
            /app\\.get\\("\/api\/narrative-news",\\s*narrativeNewsLimiter,\\s*requireAccess/
          ];
          const adminRoutes = [
            /app\\.get\\("\/api\/admin\/waitlist",\\s*requireAdmin/,
            /app\\.post\\("\/api\/admin\/waitlist\/:id\/invite",\\s*requireAdmin/,
            /app\\.patch\\("\/api\/admin\/waitlist\/:id\/access",\\s*requireAdmin/
          ];
          for (const pattern of [...accessRoutes, ...adminRoutes]) {
            if (!pattern.test(source)) throw new Error('Missing protected route or access middleware: ' + pattern);
          }
          console.log('Protected API routes and admin gates verified.');
          NODE
